services:
  - type: web
    name: shadow-telegram-agent
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: SHADOW_AGENT_AUTO_DEPLOY
        value: "true"
      - key: SHADOW_DEV_GITHUB_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: auto
      - key: APPROVED_CHAT_IDS
        sync: false
      - key: SHADOW_CHAT_PROFILES
        sync: false
      - key: SHADOW_MODEL_SELECTION
        sync: false
      - key: REPLY_ENABLED
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GROUP_REPLY_MODE
        value: mentions
      - key: CONTEXT_MESSAGES
        value: "12"
      - key: MAX_REPLY_CHARS
        value: "3800"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PORT
        value: "10000"
