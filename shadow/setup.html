<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Shadow · Telegram ulanishi</title>
  <style>
    :root{color-scheme:dark;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:#080b12;color:#eef2f7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 10%,#0c2929 0,transparent 45%),#080b12}
    main{position:relative;width:min(100%,520px);padding:30px;border:1px solid #26313e;border-radius:24px;background:#111722;box-shadow:0 24px 80px #0008}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#16a085;color:#041310;font-weight:800;font-size:20px}
    .brand strong,.brand small{display:block;letter-spacing:.12em}.brand small{color:#9ba9b9;font-size:11px;margin-top:2px}
    h1{font-size:28px;line-height:1.2;margin:0 0 8px}
    .intro{color:#aab5c3;margin:0 0 26px}
    label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}
    input{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1px solid #354353;background:#0a1019;color:#f5f7fa;font:inherit;outline:none}
    input:focus{border-color:#55d3bd;box-shadow:0 0 0 3px #55d3bd22}
    button,.link{width:100%;min-height:50px;margin-top:14px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:#55d3bd;color:#06201b;font:700 15px system-ui;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    [hidden]{display:none!important}
    #status{min-height:24px;margin:22px 0 0;color:#b7c1ce;overflow-wrap:anywhere}
    #status.error{color:#ff9d9d}#status.success{color:#70e2cd}
    .help{font-size:12px;color:#8492a2;margin:9px 0 0}
    @media(max-width:480px){body{padding:16px}main{padding:23px;border-radius:20px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">S</div><div><strong>SHADOW</strong><small>SHAXSIY YORDAMCHI</small></div></div>
    <h1>Telegram ulanishi</h1>
    <p class="intro">Hisobingizni xavfsiz ulash yoki boshqa hisobga o‘tish.</p>

    <form id="authForm">
      <label for="token">Boshqaruv tokeni</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <button type="submit">Davom etish</button>
      <p class="help">Boshqaruv panelidagi ADMIN_TOKEN yoki SETUP_TOKEN ni kiriting. Uni hech kimga yubormang.</p>
    </form>

    <form id="phoneForm" hidden>
      <label for="phone">Yangi yoki mavjud Telegram raqami</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+998…" required>
      <button type="submit">Kirish kodini yuborish</button>
    </form>

    <form id="codeForm" hidden>
      <label for="code">Telegram ilovasiga kelgan kod</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
      <button type="submit">Kodni tasdiqlash</button>
    </form>

    <form id="passwordForm" hidden>
      <label for="password">Telegram ikki bosqichli tasdiqlash paroli</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Kirish</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <a id="dashboardLink" class="link" href="/dashboard" hidden>Boshqaruv panelini ochish</a>
  </main>
  <script>
    const forms={auth:document.querySelector('#authForm'),phone:document.querySelector('#phoneForm'),code:document.querySelector('#codeForm'),password:document.querySelector('#passwordForm')};
    const status=document.querySelector('#status');
    const dashboardLink=document.querySelector('#dashboardLink');
    function show(stage){for(const [name,form] of Object.entries(forms))form.hidden=name!==stage;}
    function message(text,kind=''){status.textContent=text;status.className=kind;}
    async function post(path,data){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let result={};try{result=await response.json()}catch{}if(!response.ok)throw Error(result.detail||'Server bilan aloqa amalga oshmadi.');return result;}
    document.querySelector('#authForm').addEventListener('submit',async event=>{event.preventDefault();const button=forms.auth.querySelector('button');button.disabled=true;try{await post('/setup/telegram/auth',{token:document.querySelector('#token').value.trim()});document.querySelector('#token').value='';show('phone');message('Kirish tasdiqlandi. Telegram telefon raqamini kiriting.')}catch(error){message(error.message,'error')}finally{button.disabled=false}});
    document.querySelector('#phoneForm').addEventListener('submit',async event=>{event.preventDefault();const button=forms.phone.querySelector('button');button.disabled=true;try{await post('/setup/telegram/code',{phone:document.querySelector('#phone').value.trim()});show('code');message('Kod Telegram ilovasiga yuborildi.')}catch(error){message(error.message,'error')}finally{button.disabled=false}});
    document.querySelector('#codeForm').addEventListener('submit',async event=>{event.preventDefault();const button=forms.code.querySelector('button');button.disabled=true;try{const result=await post('/setup/telegram/verify',{code:document.querySelector('#code').value.trim()});if(result.status==='password_required'){show('password');message('Ikki bosqichli tasdiqlash parolini kiriting.')}else complete(result)}catch(error){message(error.message,'error')}finally{button.disabled=false}});
    document.querySelector('#passwordForm').addEventListener('submit',async event=>{event.preventDefault();const button=forms.password.querySelector('button');button.disabled=true;try{complete(await post('/setup/telegram/password',{password:document.querySelector('#password').value}))}catch(error){message(error.message,'error')}finally{button.disabled=false}});
    function complete(result){for(const form of Object.values(forms))form.hidden=true;const account=result.account||'Telegram akkaunti';const saved=result.session_persisted?'Akkaunt Render’da saqlandi.':'Akkaunt doimiy saqlanmadi; Render qayta ishga tushsa, qayta kirish kerak bo‘ladi.';const text=result.status==='added'?`${account} akkauntlar ro‘yxatiga qo‘shildi. Hozirgi faol akkaunt${result.active_account?' ('+result.active_account+')':''} o‘zgarmadi. ${saved}`:`${account} ulandi. Xabar yuborish o‘chirilgan. ${saved}`;message(text,'success');dashboardLink.hidden=false;}
    (async()=>{try{const response=await fetch('/setup/telegram/status',{credentials:'same-origin',cache:'no-store'});if(!response.ok)return;const current=await response.json();forms.auth.hidden=true;show('phone');message(current.connected?`${current.account||'Akkaunt'} faol. Yangi akkaunt uchun Telegram raqamini kiriting.`:'Boshqaruv paneliga kirish tasdiqlandi. Ulanadigan Telegram raqamini kiriting.','success');}catch(_){}})();
  </script>
</body>
</html>
