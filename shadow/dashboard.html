async function load(){$('#refresh').disabled=true;$('#refresh').textContent='Yuklanmoqda…';try{const [s,c]=await Promise.all([api('/dashboard/api/status'),api('/dashboard/api/chats')]);syncPanels(s);const conn=$('#connection');conn.className='value '+(s.connected?'online':'safe');conn.replaceChildren(Object.assign(document.createElement('span'),{className:'status-dot'}),document.createTextNode(s.connected?'Ulangan':'Ulanmagan'));$('#connectionSub').textContent=s.connected?'Telegram bilan faol aloqa':'Ulanish yoki sozlash kerak';$('#account').textContent=s.account||'Ulanmagan';$('#approved').textContent=String(s.approved_chat_count);$('#replyState').textContent=s.reply_enabled?'Avtomatik javoblar yoqilgan':'Xabar yuborish o‘chirilgan';$('#replySwitch').setAttribute('aria-checked',String(s.reply_enabled));$('#replySwitch').setAttribute('aria-label',s.reply_enabled?'Avtomatik javoblarni o‘chirish':'Avtomatik javoblarni yoqish');$('#replyHelp').textContent=s.reply_enabled?'Shadow faqat ruxsat berilgan chatlarda javob beradi.':'Avtomatik javoblar o‘chiq. Yoqishdan oldin sozlamalarni tekshiring.';$('#chatCount').textContent=c.chats.length+' ta chat';const list=$('#chats');list.textContent='';if(!c.chats.length){noMatches.hidden=true;list.className='empty';list.textContent=s.connected?'Hozircha chatlar topilmadi':'Telegram ulangach chatlar shu yerda ko‘rinadi';return}list.className='';for(const chat of c.chats){const row=document.createElement('div');row.className='row';row.dataset.title=String(chat.title||'').toLocaleLowerCase('uz');row.dataset.kind=chat.kind;row.dataset.approved=String(chat.approved);row.dataset.unread=String(chat.unread_count||0);row.setAttribute('role','row');const main=document.createElement('span');main.className='chat-main';main.setAttribute('role','cell');const avatar=document.createElement('span');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=(chat.title||'?').trim().slice(0,1).toUpperCase();const name=document.createElement('span');name.className='chat-name';name.textContent=chat.title;const chatId=document.createElement('small');chatId.textContent='ID: '+chat.id;name.append(chatId);main.append(avatar,name);const kind=document.createElement('span');kind.className='chat-kind';kind.setAttribute('role','cell');kind.textContent=chat.kind;const badge=document.createElement('span');badge.className='badge '+(chat.approved?'':'off');badge.setAttribute('role','cell');badge.textContent=chat.approved?'Ruxsatli':'Kuzatuv';const unread=document.createElement('span');unread.className='unread';unread.setAttribute('role','cell');unread.textContent=chat.unread_count?String(chat.unread_count):'—';const permission=document.createElement('div');permission.className='approval-cell';permission.setAttribute('role','cell');badge.removeAttribute('role');const button=document.createElement('button');button.type='button';button.className='approval-btn'+(chat.approved?' remove':'');button.textContent=chat.approved?'Ruxsatni olib tashlash':'+ Tanlash';button.setAttribute('aria-label',chat.title+(chat.approved?' — ruxsatni olib tashlash':' — avtojavob uchun tanlash'));button.disabled=approvalBusy;button.addEventListener('click',()=>changeChatApproval(chat));permission.append(badge,button);if(chat.approved){const profileButton=document.createElement('button');profileButton.type='button';profileButton.className='profile-btn';profileButton.textContent=chat.has_profile?'Xotirani boshqarish':'Maxsus xotira';profileButton.setAttribute('aria-label',chat.title+' — chat xotirasini boshqarish');profileButton.addEventListener('click',()=>openChatProfile(chat));permission.append(profileButton)}row.append(main,kind,permission,unread);list.append(row)}filterChats()}catch(err){if(err.message==='auth'){$('#login').hidden=false;$('#app').hidden=true;$('#loginError').textContent='Panel sessiyasi tugadi yoki brauzer uni yubormadi. Tokenni qayta kiriting.'}else{$('#chats').className='empty';$('#chats').textContent='Ma’lumotlarni yuklab bo‘lmadi. Yangilab ko‘ring.'}}finally{$('#refresh').disabled=false;$('#refresh').textContent='↻ Yangilash'}}
$('#replySwitch').addEventListener('click',async()=>{const turnOn=$('#replySwitch').getAttribute('aria-checked')!=='true';if(turnOn&&!window.confirm('Avtomatik javoblarni yoqsangiz, Shadow tasdiqlangan chatlarga sizning nomingizdan javob yuborishi mumkin. Yoqilsinmi?'))return;$('#replySwitch').disabled=true;try{const s=await api('/dashboard/api/replies',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:turnOn})});$('#replyPanel').classList.toggle('reply-on',!!s.reply_enabled);$('#replyPanel .warn-icon').textContent=s.reply_enabled?'✓':'!';$('#replySwitch').setAttribute('aria-checked',String(s.reply_enabled));$('#replySwitch').setAttribute('aria-label',s.reply_enabled?'Avtomatik javoblarni o‘chirish':'Avtomatik javoblarni yoqish');$('#replyState').textContent=s.reply_enabled?'Avtomatik javoblar yoqilgan':'Xabar yuborish o‘chirilgan';$('#replyHelp').textContent=s.reply_enabled?'Shadow faqat ruxsat berilgan chatlarda javob beradi.':'Avtomatik javoblar o‘chiq.';await load();if(s.persisted===false)$('#replyHelp').textContent+=' Bu rejim vaqtinchalik. Doimiy saqlash uchun RENDER_API_KEY kerak.'}catch(err){$('#replyHelp').textContent=err.message==='auth'?'Panel sessiyasi tugadi. Qayta kiring.':err.message}finally{$('#replySwitch').disabled=false}});
$('#refresh').addEventListener('click',load);$('#logout').addEventListener('click',async()=>{await api('/dashboard/logout',{method:'POST'});dashboardToken='';$('#app').hidden=true;$('#login').hidden=false});api('/dashboard/api/status').then(()=>{showApp();load()}).catch(()=>{});
</script>
