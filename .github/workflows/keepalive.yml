name: Keep-alive ping (external)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          HEALTHZ_URL: ${{ vars.HEALTHZ_URL }}
        run: |
          if [ -z "$HEALTHZ_URL" ]; then
            echo "::error::HEALTHZ_URL repository variable is not set. Settings > Secrets and variables > Actions > Variables > New repository variable, pointing at https://<your-service>.onrender.com/healthz"
            exit 1
          fi
          curl -fsS --max-time 15 "$HEALTHZ_URL" > /dev/null
