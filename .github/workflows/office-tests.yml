name: Office and math tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      # One run picks up every tests/test_*.py file automatically (unittest- and pytest-style).
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integrations/freellmapi/gateway.test.mjs
      - run: node scripts/update_free_catalog.mjs --check
