name: Shadow automatic deployment
on:
  workflow_run:
    workflows: [Office and math tests]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing owner automatic-release PR number
        type: number
        required: true
permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read
concurrency:
  group: shadow-automatic-deployment
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'shadow-auto-deploy') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Includes CI wait, slow health requests, and rollback verification.
    timeout-minutes: 45
    steps:
      # Only trusted default-branch code is loaded; never checkout or execute the PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const {run}=require(process.env.GITHUB_WORKSPACE+'/scripts/auto-deploy.cjs');
            return await run({github,context,core});
