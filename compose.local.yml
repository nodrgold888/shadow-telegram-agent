# Run Shadow and its local Ollama model together on an always-on computer.
# Ollama is reachable only inside this Docker network; the dashboard binds to localhost.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  shadow:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      SHADOW_STATE_FILE: /app/data/state.json
      SHADOW_DEV_DIR: /app/data/development
      SHADOW_LOCAL_AI_BASE_URL: http://ollama:11434/v1
      SHADOW_LOCAL_AI_API_KEY: ollama-local
      SHADOW_LOCAL_AI_MODEL: qwen2.5-coder:7b
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - shadow-state:/app/data

volumes:
  ollama-models:
  shadow-state:
